[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roam-ai-travel-assistant"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.111.0",
    "python-dotenv==1.0.1",
    "google-genai==1.11.0",
    "langgraph==0.1.19",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["uvicorn[standard]==0.30.1"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.vercel]
entrypoint = "backend.main:app"
