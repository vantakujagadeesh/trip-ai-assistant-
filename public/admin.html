<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Roam | Booking Requests</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: "#f8f9fa",
            primary: "#a43c12",
            "on-surface": "#191c1d",
            "on-surface-variant": "#57423b",
            outline: "#8b7169",
            "outline-variant": "#dec0b6",
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body class="min-h-screen bg-surface text-on-surface">
  <header class="border-b border-outline-variant bg-white px-6 py-4">
    <div class="mx-auto flex max-w-6xl items-center justify-between">
      <a href="index.html" class="text-2xl font-extrabold text-primary">Roam</a>
      <nav class="flex items-center gap-5 text-sm">
        <a href="my-trips.html" class="font-medium text-on-surface-variant hover:text-primary">My Trips</a>
        <button id="signout-button" type="button" class="font-semibold text-primary hover:underline">Sign out</button>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-6 py-10">
    <h1 class="text-3xl font-extrabold">Booking requests</h1>
    <p class="mt-2 text-sm text-on-surface-variant">Manage customer requests. A status change does not itself book or charge for travel.</p>
    <p id="admin-status" role="status" aria-live="polite" class="mt-4 text-sm text-on-surface-variant"></p>
    <div id="request-list" class="mt-6 grid gap-4"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app-auth.js"></script>
  <script src="admin.js"></script>
</body>
</html>
